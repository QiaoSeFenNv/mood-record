# Local, loopback-only deployment drill. Never publish this DEV-auth service.
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: mood-record-api:local
    init: true
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      DATABASE_PATH: /var/lib/mood-record/mood-record.sqlite3
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../../data:/var/lib/mood-record
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    stop_grace_period: 30s
